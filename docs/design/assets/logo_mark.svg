<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AgroGuard Mark">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#144718"/>
    </linearGradient>
    <linearGradient id="thermoGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="65%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
  </defs>

  <!-- Rounded app icon canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#F6F8F5" stroke="#1B5E20" stroke-width="3"/>

  <!-- Protective Shield + Greenhouse Pitched Dome -->
  <path d="M64 16 L104 34 L104 64 C104 89 87 104 64 113 C41 104 24 89 24 64 L24 34 Z" fill="url(#shieldGrad)"/>

  <!-- Inner Greenhouse Frame Ribs -->
  <path d="M64 26 L94 40 L94 63 C94 82 81 95 64 103 C47 95 34 82 34 63 L34 40 Z" fill="none" stroke="#F6F8F5" stroke-opacity="0.28" stroke-width="2.5"/>
  <path d="M40 50 L88 50" stroke="#F6F8F5" stroke-opacity="0.24" stroke-width="2" stroke-linecap="round"/>

  <!-- Botanical Leaf Silhouette (left and right lobes) -->
  <path d="M64 88 C47 84 40 70 43 52 C53 53 60 60 64 71 C68 60 75 53 85 52 C88 70 81 84 64 88 Z" fill="#F6F8F5"/>
  <path d="M64 88 C47 84 40 70 43 52 C53 53 60 60 64 71 Z" fill="#E8F1E9"/>

  <!-- Thermo-Indicator Stem (Heat Guard symbol) -->
  <rect x="60.5" y="34" width="7" height="42" rx="3.5" fill="#1B5E20"/>
  <rect x="62" y="38" width="4" height="36" rx="2" fill="url(#thermoGrad)"/>
  <circle cx="64" cy="79" r="7.5" fill="#1B5E20"/>
  <circle cx="64" cy="79" r="5" fill="#E67E22"/>
  <circle cx="64" cy="79" r="2" fill="#F6F8F5"/>

  <!-- Thermal Pulse Arc at Dome Apex -->
  <path d="M54 31 Q64 24 74 31" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
</svg>
